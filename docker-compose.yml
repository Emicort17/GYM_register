version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gestion_persona_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-gestion_persona}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./GYM_register
      dockerfile: Dockerfile
    container_name: gestion_persona_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-gestion_persona}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: ${SERVER_PORT:-8000}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./GYM_app
      dockerfile: Dockerfile
    container_name: gestion_persona_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  db_data:
